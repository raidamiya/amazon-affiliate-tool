<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X アフィリエイト投稿ツール（Workers版） v5.0</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: #1d9bf0;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .tabs {
            display: flex;
            background: #f7f9fa;
            border-bottom: 2px solid #e1e8ed;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
        }

        .tab:hover {
            background: rgba(29, 155, 240, 0.1);
        }

        .tab.active {
            color: #1d9bf0;
            background: white;
            border-bottom: 3px solid #1d9bf0;
        }

        .tab-content {
            display: none;
            padding: 25px;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        input[type="url"],
        input[type="text"],
        input[type="search"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #1d9bf0;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #1d9bf0;
            color: white;
            width: 100%;
            padding: 15px;
            font-size: 16px;
        }

        .btn-primary:hover:not(:disabled) {
            background: #1a8cd8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(29, 155, 240, 0.3);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-outline {
            background: white;
            color: #1d9bf0;
            border: 2px solid #1d9bf0;
        }

        .btn-outline:hover {
            background: #1d9bf0;
            color: white;
        }

        .btn-success {
            background: #10a37f;
            color: white;
        }

        .btn-warning {
            background: #ff9800;
            color: white;
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .char-count {
            text-align: right;
            font-size: 13px;
            color: #666;
            margin-top: 5px;
        }

        .char-count.warning {
            color: #f91880;
            font-weight: 600;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .error.show {
            display: block;
        }

        .success {
            background: #e8f5e9;
            border: 2px solid #81c784;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .success.show {
            display: block;
        }

        .info {
            background: #e3f2fd;
            border: 2px solid #90caf9;
            color: #1565c0;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .info.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>
                🐦 X アフィリエイト投稿ツール
                <span style="background:#10a37f;padding:3px 8px;border-radius:4px;font-size:12px;">Workers版</span>
                <span style="background:#ff6b6b;padding:3px 8px;border-radius:4px;font-size:12px;margin-left:5px;">v5.0</span>
            </h1>
            <p>高精度な価格取得 × AI宣伝文生成 × 自動投稿</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('manual')">🔗 URL指定</button>
            <button class="tab" onclick="switchTab('trending')">💡 人気ワード</button>
            <button class="tab" onclick="switchTab('detailed')">⚡ 価格取得強化</button>
            <button class="tab" onclick="switchTab('ranking')">📊 ランキング</button>
            <button class="tab" onclick="switchTab('auto')">🤖 自動投稿</button>
            <button class="tab" onclick="switchTab('ai')">✨ AI宣伝文</button>
           
        </div>

        <!-- ========================= -->
        <!-- URL指定タブ -->
        <!-- ========================= -->

        <div id="manual-tab" class="tab-content active">
            <div class="form-group">
                <label>📦 Amazon商品URL</label>
                <input type="url" id="amazonUrl" placeholder="https://www.amazon.co.jp/dp/B0XXXXXXXXX">
            </div>
 <button id="debug-btn" style="margin-left:10px; background:#444; color:#fff;">  🔍 デバッグ（HTML取得）</button>
            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag" placeholder="yourname-22">
            </div>

            <div class="form-group">
                <label>📝 投稿テンプレート</label>
                <textarea id="customTemplate">{商品名}
詳細・最新価格はこちら⇒⇒
{リンク}

{タグ}</textarea>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="useShortUrl" checked>
                    短縮URLを使用
                </label>
            </div>

            <button class="btn btn-primary" onclick="generateFromUrl()" id="generateBtn">
                ✨ 投稿文を生成
            </button>

            <div class="loading-inline" id="loading-manual" style="display:none;">
                <div class="spinner-small"></div>
                <span>生成中です...</span>
            </div>

            <div class="error" id="error-manual"></div>
            <div class="result" id="result-manual"></div>
            <div id="charCount-manual" class="char-count"></div>

            <div id="actions-manual" style="display:none;">
                <div class="button-group">
                    <button class="btn btn-success" onclick="postToX('manual')">🐦 Xで投稿する</button>
                    <button class="btn btn-outline" onclick="copyText('manual')">📋 コピー</button>
                </div>
            </div>
        </div>

        <!-- ========================= -->
        <!-- 人気ワードタブ -->
        <!-- ========================= -->

        <div id="trending-tab" class="tab-content">
            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag-trending" placeholder="yourname-22">
            </div>

            <div class="form-group">
                <label>💡 話題の商品ワード</label>
                <select id="trendingKeyword" class="keyword-select">
                    <option value="">-- 話題のワードを選択 --</option>
                </select>
                <button class="btn btn-outline" onclick="updateTrendingKeywords()" style="margin-top:10px;">🔄 更新</button>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="useShortUrl-trending" checked>
                    短縮URLを使用
                </label>
            </div>

            <div class="error" id="error-trending"></div>
            <div class="success" id="success-trending"></div>
            <div class="info" id="info-trending"></div>

            <div id="bulk-actions-trending" class="bulk-actions" style="display:none;">
                <button class="btn btn-warning" onclick="startBulkPost('trending')">🚀 順番に投稿</button>
                <button class="btn btn-danger" onclick="resetPosted('trending')">🔄 リセット</button>
            </div>

            <div class="loading" id="trending-loading" style="display:none;">
                <div class="spinner"></div>
                <p>商品を検索中...</p>
            </div>

            <div id="trending-results" class="product-list"></div>
        </div>

        <!-- ========================= -->
        <!-- 価格取得強化タブ -->
        <!-- ========================= -->

        <div id="detailed-tab" class="tab-content">
            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag-detailed" placeholder="yourname-22">
            </div>

            <div class="form-group">
                <label>⚡ 商品検索キーワード</label>
                <div class="search-controls">
                    <input type="search" id="detailedQuery" placeholder="商品名やキーワードを入力">
                    <button class="btn btn-primary" onclick="detailedSearch(document.getElementById('detailedQuery').value)">⚡ 検索</button>
                </div>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="useShortUrl-detailed" checked>
                    短縮URLを使用
                </label>
            </div>

            <div class="error" id="error-detailed"></div>
            <div class="success" id="success-detailed"></div>
            <div class="info" id="info-detailed"></div>

            <div id="bulk-actions-detailed" class="bulk-actions" style="display:none;">
                <button class="btn btn-warning" onclick="startBulkPost('detailed')">🚀 順番に投稿</button>
                <button class="btn btn-danger" onclick="resetPosted('detailed')">🔄 リセット</button>
            </div>

            <div class="loading" id="detailed-loading" style="display:none;">
                <div class="spinner"></div>
                <p id="detailed-progress">商品を詳細取得中...</p>
                <button class="btn btn-danger" onclick="cancelDetailedSearch()" style="margin-top:10px;">❌ キャンセル</button>
            </div>

            <div id="detailed-results" class="product-list"></div>
        </div>

        <!-- ========================= -->
        <!-- ランキングタブ -->
        <!-- ========================= -->

        <div id="ranking-tab" class="tab-content">
            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag-ranking" placeholder="yourname-22">
            </div>

            <div class="form-group">
                <label>📊 カテゴリ選択</label>
                <div class="ranking-controls">
                    <select id="category" onchange="updateCategoryUrl()">
                        <option value="bestsellers">総合ベストセラー</option>
                        <option value="kitchen">ホーム&キッチン</option>
                        <option value="electronics">家電&カメラ</option>
                        <option value="computers">パソコン・周辺機器</option>
                        <option value="books">本</option>
                        <option value="dvd">DVD・ミュージック</option>
                        <option value="toys">おもちゃ</option>
                        <option value="hobby">ホビー</option>
                        <option value="sports">スポーツ&アウトドア</option>
                        <option value="diy">DIY・工具</option>
                        <option value="food">食品・飲料</option>
                        <option value="beauty">ビューティー</option>
                        <option value="fashion">ファッション</option>
                        <option value="jewelry">ジュエリー</option>
                        <option value="shoes">シューズ&バッグ</option>
                        <option value="pet">ペット用品</option>
                        <option value="baby">ベビー&マタニティ</option>
                        <option value="custom">カスタムURL</option>
                    </select>

                    <button class="btn btn-primary" onclick="fetchRanking()">📊 取得</button>
                </div>
            </div>

            <div class="form-group" id="custom-url-group" style="display:none;">
                <label>カスタムランキングURL</label>
                <input type="url" id="customRankingUrl" placeholder="https://www.amazon.co.jp/gp/bestsellers/...">
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="useShortUrl-ranking" checked>
                    短縮URLを使用
                </label>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="useDeepFetch-ranking">
                    ⚡ 価格取得強化モード
                </label>
            </div>

            <div class="error" id="error-ranking"></div>
            <div class="success" id="success-ranking"></div>
            <div class="info" id="info-ranking"></div>

            <div id="bulk-actions-ranking" class="bulk-actions" style="display:none;">
                <button class="btn btn-warning" onclick="startBulkPost('ranking')">🚀 順番に投稿</button>
                <button class="btn btn-danger" onclick="resetPosted('ranking')">🔄 リセット</button>
            </div>

            <div class="loading" id="ranking-loading" style="display:none;">
                <div class="spinner"></div>
                <p>ランキング取得中...</p>
            </div>

            <div id="product-list" class="product-list"></div>
        </div>

        <!-- ========================= -->
        <!-- 自動投稿タブ -->
        <!-- ========================= -->

        <div id="auto-tab" class="tab-content">
            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag-auto" placeholder="yourname-22">
            </div>

            <div class="form-group">
                <label>🔑 キーワードリスト（1行1キーワード）</label>
                <textarea id="keyword-list" placeholder="イヤホン
プロテイン
タオル"></textarea>
            </div>

            <div class="form-group">
                <label>⏱️ 投稿間隔（分）</label>
                <input type="number" id="post-interval" value="15" min="1">
            </div>

            <div class="form-group">
                <label>📌 1キーワードあたりの投稿数</label>
                <input type="number" id="posts-per-keyword" value="3" min="1">
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="auto-use-trending" checked>
                    人気ワードを自動取得して使用
                </label>
            </div>

            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="auto-skip-no-price" checked>
                    価格が取得できない商品をスキップ
                </label>
            </div>
            
            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="avoid-duplicate-keywords" checked>
                    使用済みキーワードを避ける
                </label>
            </div>
            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="auto-use-ai" checked>
                    🤖 AIで宣伝文を生成する（OpenRouter）
                </label>
            </div>
            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;">
                    <input type="checkbox" id="auto-mode-enabled" checked>
                    🤖 完全自動モード（Tampermonkey）
                </label>
            </div>

            <div class="form-group" id="confirm-time-group" style="display:none;">
                <label>⏳ 自動投稿の確認時間（秒）</label>
                <input type="number" id="confirm-time" value="8" min="1">
            </div>

            <button id="auto-start-btn" class="btn btn-primary" onclick="autoPoster.start()">🚀 自動投稿開始</button>
            <button id="auto-stop-btn" class="btn btn-danger" onclick="autoPoster.stop()" style="display:none;">⛔ 停止</button>

            <div id="auto-status" style="display:none; margin-top:20px;">
                <p>現在のキーワード: <span id="current-keyword">-</span></p>
                <p>次の投稿予定時刻: <span id="next-post-info">-</span></p>
                <p>残り時間: <span id="auto-timer">--:--</span></p>

                <div style="margin-top:10px;">
                    <strong>投稿進捗</strong>
                    <div style="background:#eee; height:10px; border-radius:5px; margin-top:5px;">
                        <div id="progress-bar" style="height:10px; width:0%; background:#1d9bf0; border-radius:5px;"></div>
                    </div>
                </div>

                <div style="margin-top:10px;">
                    <p>総投稿数: <span id="stat-total">0</span></p>
                    <p>成功: <span id="stat-success">0</span> / 失敗: <span id="stat-failed">0</span></p>
                </div>
            </div>

            <div id="auto-log" style="display:none; margin-top:20px; background:#f7f9fa; border:1px solid #ddd; padding:10px; height:200px; overflow-y:auto;">
                <div id="log-content"></div>
            </div>
        </div>

        <!-- ========================= -->
        <!-- AI宣伝文タブ -->
        <!-- ========================= -->

        <div id="ai-tab" class="tab-content">
            <div class="info-box" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                <strong>✨ AI自動生成（v2.9 最適化版）</strong><br>
                商品URLを入力すると、AIが180文字以内の宣伝文を生成します。
            </div>

            <div class="form-group">
                <label>🤖 使用するAIモデル</label>
                <div style="display:flex; gap:10px; margin-bottom:10px;">
                    <button class="btn btn-outline" onclick="selectAIModel('gemini')" id="ai-btn-gemini" style="flex:1;">✨ Gemini</button>
                    <button class="btn btn-outline" onclick="selectAIModel('grok')" id="ai-btn-grok" style="flex:1;">⚡ Grok</button>
                    <button class="btn btn-outline" onclick="selectAIModel('openrouter')" id="ai-btn-openrouter" style="flex:1;">🌐 OpenRouter</button>
                </div>
                <small id="ai-model-description" style="color:#666; font-size:12px;">
                    AIモデルを選択してください
                </small>
            </div>

            <div class="form-group" id="openrouter-model-selector" style="display:none;">
                <label>🎯 OpenRouterモデル</label>
                <select id="openrouter-model">
                    <option value="z-ai/glm-4.5-air:free">GLM 4.5 Air（高品質・安定）</option>
                    <option value="stepfun/step-3.5-flash:free">Step-3.5 Flash（高速・安定）</option>
                    <option value="google/gemma-3n-e4b-it:free">Gemma 3n e4b（軽量・安定）</option>
                </select>
            </div>

            <div class="form-group">
                <label id="ai-key-label">🔑 API Key</label>
                <input type="password" id="ai-api-key" placeholder="APIキーを入力">
                <small id="ai-key-link" style="color:#666; font-size:12px;"></small>
            </div>

            <div class="form-group">
                <label>📦 Amazon商品URL</label>
                <input type="url" id="ai-product-url" placeholder="https://www.amazon.co.jp/dp/B0XXXXXXXXX">
            </div>

            <div class="form-group">
                <label>🏷️ アソシエイトタグ</label>
                <input type="text" id="tag-ai" placeholder="yourname-22">
            </div>

            <button class="btn btn-primary" onclick="generateAIPost()" id="generate-ai-btn">
                ✨ AI宣伝文を生成
            </button>

            <div class="loading-inline" id="loading-ai" style="display:none;">
                <div class="spinner-small"></div>
                <span id="ai-loading-text">AIが宣伝文を生成中...</span>
            </div>

            <div class="error" id="error-ai"></div>

            <div id="ai-result-container" style="display:none; margin-top:20px;">
                <div class="form-group">
                    <label>📝 生成された宣伝文（編集可能）</label>
                    <textarea id="ai-generated-text" style="min-height:200px;" oninput="updateCharCount(this.value, 'ai')"></textarea>
                </div>

                <div id="charCount-ai" class="char-count"></div>

                <div class="button-group">
                    <button class="btn btn-success" onclick="postToX('ai')">🐦 Xで投稿する</button>
                    <button class="btn btn-outline" onclick="copyText('ai')">📋 コピー</button>
                    <button class="btn btn-warning" onclick="regenerateAIPost()">🔄 再生成</button>
                </div>
            </div>
        </div>

        <!-- ========================= -->
        <!-- ここから JavaScript 開始 -->
        <!-- ========================= -->

        <script>
        let currentPostText = {
            manual: "",
            trending: "",
            detailed: "",
            ranking: "",
            ai: ""
        };

        let currentProducts = {
            trending: [],
            detailed: [],
            ranking: []
        };

        let postedProducts = {
            trending: new Set(),
            detailed: new Set(),
            ranking: new Set()
        };

        function switchTab(tab) {
            document.querySelectorAll(".tab").forEach(btn => btn.classList.remove("active"));
            event.target.classList.add("active");

            document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
            document.getElementById(tab + "-tab").classList.add("active");
        }

        /* ============================
           AIモデル選択
        ============================ */

        let currentAIModel = "gemini";
        let currentAIPrompt = "";

        function selectAIModel(model) {
            currentAIModel = model;

            const geminiBtn = document.getElementById("ai-btn-gemini");
            const grokBtn = document.getElementById("ai-btn-grok");
            const openrouterBtn = document.getElementById("ai-btn-openrouter");
            const apiKeyLabel = document.getElementById("ai-key-label");
            const apiKeyInput = document.getElementById("ai-api-key");
            const apiKeyLink = document.getElementById("ai-key-link");
            const modelDesc = document.getElementById("ai-model-description");
            const modelSelector = document.getElementById("openrouter-model-selector");

            [geminiBtn, grokBtn, openrouterBtn].forEach(btn => {
                btn.classList.remove("btn-primary");
                btn.classList.add("btn-outline");
            });

            if (model === "gemini") {
                geminiBtn.classList.add("btn-primary");
                geminiBtn.classList.remove("btn-outline");
                modelSelector.style.display = "none";

                apiKeyLabel.textContent = "🔑 Gemini API Key";
                apiKeyInput.placeholder = "AIzaSy...";
                apiKeyLink.innerHTML = `💡 <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studioで無料取得</a>`;

		async function callGeminiAPI(apiKey, prompt) {
		    const url = "https://generativelanguage.googleapis.com/v1/models/gemini-2.0-flash:generateContent";

		    const body = {
		        contents: [
		            {
		                role: "user",
		                parts: [{ text: prompt }]
		            }
		        ],
		        generationConfig: {
		            temperature: 0.9,
		            maxOutputTokens: 1024
		        }
		    };

		    const res = await fetch(`${url}?key=${apiKey}`, {
		        method: "POST",
		        headers: { "Content-Type": "application/json" },
		        body: JSON.stringify(body)
		    });

		    if (!res.ok) {
		        const err = await res.text();
		        throw new Error("Gemini API error: " + res.status + " / " + err);
		    }

		    const data = await res.json();

		    // 安全にテキストを抽出
		    if (
		        !data.candidates ||
		        !data.candidates[0] ||
		        !data.candidates[0].content ||
		        !data.candidates[0].content.parts
		    ) {
		        throw new Error("Gemini API response invalid");
		    }

		    return data.candidates[0].content.parts
		        .map(part => part.text || "")
		        .join("")
		        .trim();
		}

                if (!title) return null;

                let parts = title.split(/[\s・\-\[\]\(\)【】]/g);

                // 長すぎる単語や短すぎる単語を除外
                parts = parts.filter(p =>
                    p.length >= 2 &&
                    p.length <= 20 &&
                    !p.match(/^\d+$/) &&         // 数字だけ
                    !p.match(/^(Amazon|ランキング|ベストセラー)$/i)
                );

                // 最初の名詞っぽい単語を返す
                return parts[0] || null;

            ============================ */
            async function getRankingFromHTML(url, maxItems = 20) {
                console.log("ランキングHTML取得開始:", url);

                const result = await fetchWithProxy(url);

                if (!result || !result.html) {
                    console.error("ランキングHTML取得失敗:", url, result);
                    return [];
                }

                const html = result.html;

                // 1) ASIN 抽出（ランキングページは data-asin がかなり素直に並ぶ）
                const asinList = [...html.matchAll(/data-asin="([A-Z0-9]{10})"/g)]
                    .map(m => m[1])
                    .filter(Boolean);

                // 2) 正式タイトル候補を複数パターンで抜く
                const titles = [];

                // パターンA: 旧ランキングレイアウトの title 属性付き div
                const reDivTitle = /<div[^>]+class="[^"]*p13n-sc-truncate[^"]*"[^>]*title="([^"]+)"[^>]*>/g;
                let m;
                while ((m = reDivTitle.exec(html)) !== null) {
                    titles.push(m[1].trim());
                }

                // パターンB: 新レイアウトの line-clamp 系クラス（テキストノード）
                const reSpanClamp = /<div[^>]+class="[^"]*p13n-sc-css-line-clamp-3[^"]*"[^>]*>([\s\S]*?)<\/div>/g;
                while ((m = reSpanClamp.exec(html)) !== null) {
                    const text = m[1].replace(/<[^>]+>/g, "").trim();
                    if (text) titles.push(text);
                }

                // パターンC: どうしても取れない場合のフォールバック（img alt）
                if (titles.length < asinList.length) {
                    const reImgAlt = /<img[^>]+alt="([^"]+)"[^>]*>/g;
                    while ((m = reImgAlt.exec(html)) !== null) {
                        const t = m[1].trim();
                        if (t) titles.push(t);
                    }
                }

                // 3) NGワードフィルタ（宣伝文・キャンペーン系を弾く）
                const NG_WORDS = [
                    "読み放題",
                    "追加料金なし",
                    "プライム会員",
                    "セール",
                    "キャンペーン",
                    "ポイントアップ",
                    "タイムセール",
                    "クーポン"
                ];

                function isValidTitle(title) {
                    return !NG_WORDS.some(ng => title.includes(ng));
                }

                const items = [];
                const len = Math.min(asinList.length, titles.length);

                for (let i = 0; i < len; i++) {
                    const asin = asinList[i];
                    const title = titles[i] || "商品名不明";

                    if (!isValidTitle(title)) continue;

                    items.push({ asin, title });
                    if (items.length >= maxItems) break;
                }

                return items;
            }

                    .replace(/[^\p{L}\p{N}\s]/gu, " ")

                const NG = [
                    "モデル", "改良", "最新版", "新型",
                    "対応", "便利", "人気", "おすすめ",
                    "静音", "大容量", "小型", "軽量",

                if (filtered.length >= 3) {

                }

                candidates.push(cleaned);

                return [...new Set(candidates)];
            }

           function parseAmazonProduct(html) {
                const product = {};

                // タイトル
                const titleMatch = html.match(/<span id="productTitle"[^>]*>([\s\S]*?)<\/span>/);
                product.title = titleMatch ? titleMatch[1].trim() : "商品名不明";

                // 価格
                let price = null;
                const price1 = html.match(/<span[^>]*class="a-price-whole"[^>]*>([\s\S]*?)<\/span>/);
                const price2 = html.match(/<span[^>]*class="a-offscreen"[^>]*>([\s\S]*?)<\/span>/);

                if (price1) price = price1[1].trim();
                else if (price2) price = price2[1].trim();
                else price = null;

                product.price = price;

                // 割引率
                const discountMatch = html.match(/savingsPercentage[^>]*>([^<]+)</);
                product.discount = discountMatch ? discountMatch[1].trim() : null;

                
                // -----------------------------
                // ④ ポイント（複数パターン対応）
                // -----------------------------
                let points = null;

                // パターン1: "328ポイント"
                let m1 = html.match(/([0-9,]+)\s*ポイント/);
                // パターン2: "328pt"
                let m2 = html.match(/([0-9,]+)\s*pt/);
                // パターン3: "ポイント: 328pt"
                let m3 = html.match(/ポイント[^0-9]*([0-9,]+)\s*pt/);
                // パターン4: "獲得ポイント: 328pt"
                let m4 = html.match(/獲得ポイント[^0-9]*([0-9,]+)\s*pt/);
                // パターン5: "ポイント:" の後にタグが入る
                let m5 = html.match(/ポイント[^<]*<[^>]*>([0-9,]+)\s*pt/);
                points = (m1?.[1] || m2?.[1] || m3?.[1] || m4?.[1] || m5?.[1]) || null;

                product.points = points;
                // 画像URL
                let img = null;
                const img1 = html.match(/"hiRes":"([^"]+)"/);
                const img2 = html.match(/"large":"([^"]+)"/);
                const img3 = html.match(/"mainUrl":"([^"]+)"/);

                if (img1) img = img1[1];
                else if (img2) img = img2[1];
                else if (img3) img = img3[1];

                product.image = img;

                // 商品説明
                const descMatch = html.match(/<div id="feature-bullets"[\s\S]*?<ul[\s\S]*?>([\s\S]*?)<\/ul>/);
                if (descMatch && descMatch[1]) {
                    const raw = descMatch[1];
                    const matches = raw.matchAll ? [...raw.matchAll(/<span[^>]*>(.*?)<\/span>/g)] : [];
                    const bullets = matches
                        .map(m => m[1].trim())
                        .filter(t => t.length > 0)
                        .slice(0, 5);
                    product.description = bullets.length > 0 ? bullets.join(" / ") : "説明情報なし";
                } else {
                    product.description = "説明情報なし";
                }

                // ASIN
                const asinMatch = html.match(/"asin":"([A-Z0-9]{10})"/);
                product.asin = asinMatch ? asinMatch[1] : "ASIN不明";

                // ★ ここから追加項目 ★

                // 星評価
                const ratingMatch = html.match(/data-hook="rating-out-of-text">([\d.]+) /);
                product.rating = ratingMatch ? ratingMatch[1] : null;

                // レビュー数
                const reviewMatch = html.match(/data-hook="total-review-count"[^>]*>([\d,]+)/);
                product.reviewCount = reviewMatch ? reviewMatch[1] : null;

                // ベストセラー
                product.isBestSeller = html.includes("ベストセラー") || html.includes("Best Seller");

                return product;
            }

            function shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }



            function calcScore(product) {
                let score = 0;

                // -----------------------------
                // ① 割引率（最重要）
                // -----------------------------
                if (product.discount) {
                    const d = parseInt(product.discount.replace(/[^0-9]/g, ""));
                    if (!isNaN(d)) {
                        score += Math.min(d * 2, 40); // 最大40点
                    }
                }

                // -----------------------------
                // ② レビュー数
                // -----------------------------
                if (product.reviewCount) {
                    const r = parseInt(product.reviewCount.replace(/[^0-9]/g, ""));
                    if (!isNaN(r)) {
                        score += Math.min(r / 100, 20); // 最大20点
                    }
                }

                // -----------------------------
                // ③ 星評価（1〜5）
                // -----------------------------
                if (product.rating) {
                    const rating = parseFloat(product.rating);
                    if (!isNaN(rating)) {
                        score += rating * 4; // 最大20点
                    }
                }

                // -----------------------------
                // ④ ポイント
                // -----------------------------
                if (product.points) {
                    const p = parseInt(product.points.replace(/[^0-9]/g, ""));
                    if (!isNaN(p)) {
                        score += Math.min(p / 50, 10); // 最大10点
                    }
                }

                // -----------------------------
                // ⑤ ベストセラータグ
                // -----------------------------
                if (product.isBestSeller) {
                    score += 10;
                }

                // -----------------------------
                // ⑥ 価格帯（安さは正義）
                // -----------------------------
                if (product.price) {
                    const price = parseInt(product.price.replace(/[^0-9]/g, ""));
                    if (!isNaN(price)) {

                        // 500〜1500円 → 衝動買いゾーン（最強）
                        if (price >= 500 && price <= 1500) {
                            score += 10;

                        // 1501〜3000円 → 売れやすいゾーン
                        } else if (price > 1500 && price <= 3000) {
                            score += 6;

                        // 3001〜8000円 → 普通
                        } else if (price > 3000 && price <= 8000) {
                            score += 3;

                        // 8000円以上 → 高額で売れにくい
                        } else {
                            score -= 5; // マイナス補正
                        }
                    }
                }

                return Math.round(score);
            }

            // シャッフル関数（ASINの順番をランダム化）
            function shuffle(array) {
                return array.sort(() => Math.random() - 0.5);
            }

            function extractMultipleASINs(html) {
                // ASIN抽出
                const matches = [...html.matchAll(/data-asin="([A-Z0-9]{10})"/g)];
                let asins = matches
                    .map(m => m[1])
                    .filter(asin => asin && asin !== "");

                // 重複除去
                asins = [...new Set(asins)];

                // ★ Prime Video / Kindle / Audible を除外
                asins = asins.filter(asin => {
                    const idx = html.indexOf(asin);
                    if (idx === -1) return false;

                    const block = html.slice(Math.max(0, idx - 300), idx + 300);

                    const ngWords = [
                        "Prime Video",
                        "/video/",
                        "primevideo",
                        "Audible",
                        "オーディオブック",
                        "Kindle",
                        "電子書籍"
                    ];

                    return !ngWords.some(ng => block.includes(ng));
                });

                // ★ ランダムシャッフル（毎回違う商品を選ぶため）
                asins = shuffle(asins);

                // ★ 上位5件だけ返す（多すぎると毎回同じ商品になる）
                return asins.slice(0, 5);
            }


            

        /* ============================================================
        🤖 AutoPosterManager v2.8（AI統合 × 完全自動化）
        ============================================================ */

        class AutoPosterManager {
            constructor() {
                this.isRunning = false;
                this.currentKeywordIndex = 0;
                this.currentProductIndex = 0;
                this.keywords = [];
                this.currentProducts = [];
                this.interval = 30;
                this.nextPostTime = null;
                this.timerId = null;

                this.stats = {
                    totalPosts: 0,
                    successPosts: 0,
                    failedPosts: 0,
                    startTime: null
                };

                this.initUIControls();
            }

            /* ------------------------------------
            UI初期化
            ------------------------------------ */
            initUIControls() {
                const autoModeCheckbox = document.getElementById("auto-mode-enabled");
                const confirmTimeGroup = document.getElementById("confirm-time-group");

                if (autoModeCheckbox) {
                    autoModeCheckbox.addEventListener("change", e => {
                        confirmTimeGroup.style.display = e.target.checked ? "block" : "none";
                    });
                }
            }


            // ▼ 投稿済みキーワードを保存
            savePostedKeyword(keyword) {
                try {
                    const raw = localStorage.getItem("postedKeywords") || "[]";
                    const posted = JSON.parse(raw);

                    // 重複登録は避ける
                    if (!posted.includes(keyword)) {
                        posted.push(keyword);
                        localStorage.setItem("postedKeywords", JSON.stringify(posted));
                    }
                } catch (e) {
                    console.warn("postedKeywords の保存に失敗:", e);
                }
            }

            /* ------------------------------------
            自動投稿開始（v2.8 + Amazonランキング対応）
            ------------------------------------ */
            async start() {
                const tag = document.getElementById("tag-auto").value.trim();
                if (!tag) return this.log("❌ アソシエイトタグを入力してください", "error");

                const useTrending = document.getElementById("auto-use-trending").checked;
                const keywordText = document.getElementById("keyword-list").value.trim();

                // -----------------------------
                // ① キーワードリストが空 → Amazonランキングから取得
                // -----------------------------
                // ① キーワードリストが空 → Amazonランキングから取得
                // ① キーワードリストが空 → Amazonランキングから取得
                if (!keywordText && useTrending) {
                    this.log("📊 カテゴリ別ランキングから人気ワード取得中...", "info");

                    const keywords = await get30TrendingKeywords();

                    if (keywords.length === 0) {
                        this.log("⚠️ 人気ワード取得に失敗。ランキングが空でした", "warning");
                        this.keywords = [];
                    } else {
                        this.keywords = keywords;
                        // ▼ 投稿済みキーワードを除外
                        try {
                            const raw = localStorage.getItem("postedKeywords") || "[]";
                            const posted = JSON.parse(raw);
                            this.keywords = this.keywords.filter(k => !posted.includes(k));
                        } catch (e) {
                            console.warn("postedKeywords の読み込みに失敗:", e);
                        }

                        // ▼ ランダム化
                        shuffleArray(this.keywords);
                        this.log(`✨ 人気ワード ${keywords.length} 件を取得しました`, "success");
                    }
                }else {
                    // -----------------------------
                    // ② 通常のキーワードリストを使用
                    // -----------------------------
                    this.keywords = keywordText
                        .split("\n")
                        .map(k => k.trim())
                        .filter(k => k);
                }

                if (this.keywords.length === 0) {
                    return this.log("❌ キーワードがありません", "error");
                }

                // 以下はそのまま（開始処理）
                this.isRunning = true;
                this.currentKeywordIndex = 0;
                this.currentProductIndex = 0;
                this.interval = parseInt(document.getElementById("post-interval").value);

                this.stats = {
                    totalPosts: 0,
                    successPosts: 0,
                    failedPosts: 0,
                    startTime: new Date()
                };

                document.getElementById("auto-start-btn").style.display = "none";
                document.getElementById("auto-stop-btn").style.display = "block";

                this.log("🚀 自動投稿を開始しました", "success");

                await this.processNext();
            }

            /* ------------------------------------
            自動投稿停止
            ------------------------------------ */
            stop() {
                this.isRunning = false;
                if (this.timerId) clearTimeout(this.timerId);

                document.getElementById("auto-start-btn").style.display = "block";
                document.getElementById("auto-stop-btn").style.display = "none";

                this.log("⛔ 自動投稿を停止しました", "warning");
            }

            

            /* ------------------------------------
            次の投稿処理（AI統合）
            ------------------------------------ */
            async processNext() {
                if (!this.isRunning) return;

                const keyword = this.keywords[this.currentKeywordIndex];
                this.log(`🔍 キーワード検索: ${keyword}`, "info");

                try {

                    // ▼ 商品リストが空なら fetchProductSmart を実行
                    if (this.currentProductIndex === 0 || this.currentProducts.length === 0) {

                        const item = { asin: null, title: keyword };

                        const result = await fetchProductSmart(item);

                        if (!result.success) {
                            this.log("⚠️ 商品ページが取得できませんでした", "warning");
                            this.moveToNextKeyword();
                            return this.scheduleNext();
                        }

                        // ★ 正しい currentProducts の構造
                        this.currentProducts = [result];
                        console.log("currentProducts:", this.currentProducts);
                    }

                    // ▼ 正しい取り出し方（result オブジェクト）
                    const result = this.currentProducts[this.currentProductIndex];

                    const html = result.html;
                    const asin = result.asin;
                    const title = result.title;

                    // 商品取得成功
                        this.log(`📦 商品取得: ${result.title}`, "info");

                        // ★ 売れやすさスコア
                        this.log(`⭐ 売れやすさスコア: ${result.score}`, "info");

                        // ★ スコア理由（価格・割引・レビュー・星評価・ポイント）
                        this.log(
                            `📊 スコア理由 → 価格:${result.price} / 割引:${result.discount} / 星:${result.rating} / レビュー:${result.reviewCount} / ポイント:${result.points} / ベストセラー:${result.isBestSeller}`,
                            "info"
                        );
                    // ▼ HTML → 商品情報
                    const product = parseAmazonProduct(html);

                    // ▼ AIで宣伝文生成
                    const postText = await this.generatePostText(product);

                    if (!postText) {
                        this.log("❌ AI生成に失敗しました", "error");
                        this.scheduleNext();
                        return;
                    }

                    // ▼ 投稿
                    this.openTwitterPost(postText);

                    this.stats.totalPosts++;
                    this.stats.successPosts++;

                    this.log("🐦 投稿完了", "success");
                    
                    this.savePostedKeyword(keyword);
                    this.currentProductIndex++;
                    if (this.currentProductIndex >= this.currentProducts.length) {
                        this.moveToNextKeyword();
                    }

                    this.scheduleNext();

                } catch (e) {
                    this.log("❌ エラー: " + e.message, "error");
                    this.stats.failedPosts++;
                    this.scheduleNext();
                }
            }

            /* ------------------------------------
            generatePostText() v3.0（商品名必須＋日本語タグ固定）
            ------------------------------------ */
            async generatePostText(product) {
                const useAI = document.getElementById("auto-use-ai").checked;
                const tag = document.getElementById("tag-auto").value.trim();

                // ❌ const asin = extractASIN(product.url);
                // product.url は存在しない

                // ✔ 正しい
                const asin = product.asin;

                const affiliateUrl = `https://www.amazon.co.jp/dp/${asin}?tag=${tag}`;
                const shortUrl = await shortenUrl(affiliateUrl);
                /* ============================
                AIを使わない場合
                ============================ */
                if (!useAI) {
                    const info = {
                        title: product.title,
                        price: product.price || "",
                        rating: "",
                        discount: ""
                    };
                    return createSimplePostText(info, shortUrl, "twitter");
                }

                /* ============================
                AIを使う場合
                ============================ */
                const apiKey = localStorage.getItem("openrouterApiKey");
                const model = document.getElementById("openrouter-model").value || "meta-llama/llama-3.3-70b-instruct:free";

                if (!apiKey) {
                    this.log("❌ OpenRouter APIキーが設定されていません", "error");
                    return null;
                }

                /* ============================
                v3.0 安定版プロンプト
                ============================ */
                const pointText = product.points ? `${product.points}pt` : "";
                const prompt = `
                あなたは日本のSNSマーケティング専門家です。
                以下の商品情報を基に、X（Twitter）向けの宣伝文を1つだけ生成してください。

                【商品名】
                ${product.title}

                【価格】
                ${product.price ? product.price + "円" : "価格情報なし"}

                【割引】
                ${product.discount || "割引情報なし"}

                【ポイント】
                ${pointText}
                【短縮URL】
                ${shortUrl}

                【厳守ルール】
                - 出力は「宣伝文のみ」。説明・前置き・分析は禁止。
                - 文章は3〜5行構成にする（改行を必ず入れる）
                - 1行目：商品の魅力を短くキャッチーに
                - 2行目：特徴を ✔ 箇条書きで2〜3個
                - 3行目：価格・割引・ポイントを自然にまとめる
                - 4行目：ハッシュタグ（日本語優先、#Amazon を含めて 2〜4 個）
                - 5行目：URL を文末に置く
                - 絵文字は 2〜4 個
                - 英語タグは禁止
                - 180 文字以内
                - 割引率や価格の再計算は禁止。計算結果を出力しない。
                - 価格や割引はそのまま表示し、再計算しない。
                - 宣伝文以外の文章を一切出力しない

                【出力形式】
                宣伝文のみをそのまま出力。
                `.trim();

                try {
                    let aiText = await callOpenRouterAPI(apiKey, prompt, model);

                    // URL を退避
                    const url = shortUrl;

                    // AIの暴走を防ぐ後処理
                    let finalText = aiText
                        .replace(/はい、.+?。/g, "")
                        .replace(/以下.+?:/gi, "")
                        .replace(/宣伝文.+?:/gi, "")
                        .replace(/動画.+?(。|！)/g, "")
                        .replace(/レビュー.+?(。|！)/g, "")
                        .replace(/\n{2,}/g, "\n")
                        .trim();

                    // ハッシュタグ整形（URL の # を壊さない）
                    finalText = finalText.replace(/(^|\s)(#\w+)/g, "$1$2");
                    // ポイントが無い商品の場合だけ「ポイント」を含む行を削除
                    if (!product.points) {
                        finalText = finalText.replace(/.*ポイント.*/g, "");
                    }
                    // URL が消えていたら最後に追加
                    if (!finalText.includes(url)) {
                        finalText += "\n" + url;
                    }

                    // 180文字制限
                    if (finalText.length > 180) {
                        finalText = finalText.substring(0, 177) + "…";
                    }

                    return finalText;

                } catch (e) {
                    this.log("❌ AI生成失敗: " + e.message, "error");

                    // ★ フォールバック投稿文
                    const safeTitle = [...product.title].slice(0, 30).join("");
                        
                    const fallback = `${safeTitle}\n【価格】${product.price || "価格情報なし"}\n${shortUrl}`;

                    this.log("⚠️ フォールバック投稿を使用します", "warn");
                    return fallback;
                }

            }

            /* ------------------------------------
            Workers版 Amazon検索（商品詳細ページで補完）
            ------------------------------------ */
            async searchProductsWithWorkers(keyword) {
                const url = `https://www.amazon.co.jp/s?k=${encodeURIComponent(keyword)}`;
                const html = await fetchWithProxy(url);

                const parser = new DOMParser();
                const doc = parser.parseFromString(html, "text/html");

                const items = doc.querySelectorAll('[data-asin]');
                const results = [];

                for (let i = 0; i < Math.min(items.length, 5); i++) {
                    const asin = items[i].getAttribute("data-asin");
                    if (!asin) continue;

                    // 商品詳細ページを再取得（ここが重要）
                    const detailUrl = `https://www.amazon.co.jp/dp/${asin}`;
                    const detailHtml = await fetchWithProxy(detailUrl);
                    const detailDoc = parser.parseFromString(detailHtml, "text/html");

                    const titleElem = detailDoc.querySelector("#productTitle");
                    const title = titleElem ? titleElem.textContent.trim() : "商品名不明";

                    const priceElem = detailDoc.querySelector(".a-price .a-offscreen");
                    let price = "";
                    if (priceElem) {
                        const m = priceElem.textContent.match(/[\d,]+/);
                        if (m) price = parseInt(m[0].replace(/,/g, "")) + "円";
                    }

                    results.push({
                        asin,
                        title,
                        price,
                        url: detailUrl
                    });

                    // Amazonに優しいウェイト
                    await new Promise(r => setTimeout(r, 1500));
                }

                return results;
            }

            /* ------------------------------------
            次のキーワードへ
            ------------------------------------ */
            moveToNextKeyword() {
                this.currentProductIndex = 0;
                this.currentKeywordIndex++;

                if (this.currentKeywordIndex >= this.keywords.length) {
                    this.currentKeywordIndex = 0;
                }
            }

            /* ------------------------------------
            次回投稿のスケジュール
            ------------------------------------ */
            scheduleNext() {
                if (!this.isRunning) return;

                this.nextPostTime = new Date(Date.now() + this.interval * 60000);
                this.log(`⏳ 次の投稿まで ${this.interval} 分`, "info");

                this.timerId = setTimeout(() => this.processNext(), this.interval * 60000);
            }

            /* ------------------------------------
            X投稿画面を開く
            ------------------------------------ */
            openTwitterPost(text) {
                const encoded = encodeURIComponent(text);
                const autoMode = document.getElementById("auto-mode-enabled").checked;
                const confirmTime = document.getElementById("confirm-time").value || "3";

                let url = `https://twitter.com/intent/tweet?text=${encoded}`;

                if (autoMode) {
                    url += `&autopost=1&confirmtime=${confirmTime}`;
                }

                window.open(url, "_blank", "width=600,height=400");
            }

            /* ------------------------------------
            ログ
            ------------------------------------ */
            log(message, type = "info") {
                const logContainer = document.getElementById("auto-log");
                const logContent = document.getElementById("log-content");

                logContainer.style.display = "block";

                const entry = document.createElement("div");
                entry.textContent = message;

                entry.style.color =
                    type === "success" ? "#10a37f" :
                    type === "error" ? "#f44336" :
                    type === "warning" ? "#ff9800" :
                    "#333";

                logContent.appendChild(entry);
                logContent.scrollTop = logContent.scrollHeight;
            }
        }

        /* ------------------------------------
        インスタンス生成
        ------------------------------------ */
        const autoPoster = new AutoPosterManager();
        </script>
